name: YouTube Shorts

on:
  schedule:
    # Every 10 minutes (GitHub often skips scheduled runs; on 3 Nov it skipped the whole evening window). The script only acts when a channel's evening slot is due.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "kit = no upload (phone kit) | private | unlisted | public"
        default: "kit"
        type: choice
        options: [kit, private, unlisted, public]
      channel:
        description: "Channel key from config/channels.json, or all"
        default: "history"
      limit:
        description: "Max videos per channel this run"
        default: "1"
      ignore_schedule:
        description: "Run now even if no slot is due"
        type: boolean
        default: true
      dry_run:
        description: "Only print metadata (no upload, no Sheet write)"
        type: boolean
        default: false

concurrency:
  group: youtube-shorts
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_HISTORY: ${{ secrets.YT_REFRESH_TOKEN_HISTORY }}
          YT_REFRESH_TOKEN_THROTTLE: ${{ secrets.YT_REFRESH_TOKEN_THROTTLE }}
          YT_REFRESH_TOKEN_PAWSIDE: ${{ secrets.YT_REFRESH_TOKEN_PAWSIDE }}
          YT_REFRESH_TOKEN_DEMENTIA: ${{ secrets.YT_REFRESH_TOKEN_DEMENTIA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          YT_MODE: ${{ inputs.mode || vars.YT_MODE || 'public' }}
          YT_PUBLIC_APPROVED: ${{ vars.YT_PUBLIC_APPROVED || 'yes' }}
          IN_CHANNEL: ${{ inputs.channel || 'all' }}
          IN_LIMIT: ${{ inputs.limit || '1' }}
          IN_IGNORE: ${{ inputs.ignore_schedule }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          START=$(date +%s)
          set -- --channel "$IN_CHANNEL" --limit "$IN_LIMIT"
          if [ "$IN_IGNORE" = "true" ]; then set -- "$@" --ignore-schedule; fi
          if [ "$IN_DRY" = "true" ]; then set -- "$@" --dry-run; fi
          python -m crossposter.run_youtube "$@"
          # GitHub often skips scheduled runs. A scheduled run that starts up to 5 h before a
          # slot waits for it here (at most 2 more slots), so the evening uploads still happen.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            for i in 1 2; do
              left=$(( $(date +%s) - START ))
              wait=$(python -m crossposter.run_youtube --seconds-to-next-slot)
              if [ "$wait" -le 0 ] || [ $(( left + wait + 600 )) -gt 19800 ]; then break; fi
              echo "Waiting $((wait / 60)) min for the next slot"; sleep $(( wait + 90 ))
              python -m crossposter.run_youtube "$@"
            done
          fi

  tests:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m pytest -q
